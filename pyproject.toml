[project]
name = "cybershield"
version = "0.1.0"
description = "A Multi-Agent AI System for E-Commerce Application Security Analysis, Runtime Threat Detection and Automated Response"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "CyberShield Research Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.5.2",
    "email-validator>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "greenlet>=3.1.1",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "redis>=5.1.0",
    "fakeredis>=2.25.0",
    "httpx>=0.27.2",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.8",
    "mypy>=1.11.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "apps/ecommerce-backend/tests"]
pythonpath = [".", "apps/ecommerce-backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]
